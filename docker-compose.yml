services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: givemeasign_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-givemeasign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-givemeasign_dev}
      POSTGRES_DB: ${POSTGRES_DB:-givemeasign}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bind to localhost only so the DB isn't exposed to the public IP on a VPS.
    # Inter-service traffic goes via the compose network (host "postgres").
    # Connect from host with DataGrip/psql at 127.0.0.1:5432.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-givemeasign}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: givemeasign_app
    env_file: .env
    environment:
      # Override DATABASE_URL so the app talks to the compose-network postgres,
      # not whatever DATABASE_URL points at in .env (which is for local dev).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-givemeasign}:${POSTGRES_PASSWORD:-givemeasign_dev}@postgres:5432/${POSTGRES_DB:-givemeasign}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    stdin_open: true
    tty: true

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: givemeasign_bot
    command: ["python", "-m", "givemeasign", "bot"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-givemeasign}:${POSTGRES_PASSWORD:-givemeasign_dev}@postgres:5432/${POSTGRES_DB:-givemeasign}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  postgres_data:
